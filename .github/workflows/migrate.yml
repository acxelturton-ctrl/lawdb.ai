name: Apply database migrations
# Run by hand (Actions tab -> Apply database migrations -> Run workflow). Applies any migration in migrations/ that the LIVE database (lawdb-ai) has not had yet,
# the same as `wrangler d1 migrations apply DB --remote`, so it is recorded in d1_migrations. Needs the CLOUDFLARE_API_TOKEN repository secret (D1 Edit).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type yes to apply the pending migrations to the LIVE database'
        default: 'no'

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'yes' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9cfcdb7afabb6ee5cf8e3419178a4650
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret first."; exit 1; fi
          npm install --no-save wrangler@4
          npx wrangler d1 migrations list DB --remote
          npx wrangler d1 migrations apply DB --remote
          npx wrangler d1 migrations list DB --remote
