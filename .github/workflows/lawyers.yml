name: Collect lawyers
# Run by hand (Actions tab -> Collect lawyers -> Run workflow). Visits each live firm's own website (politely: robots.txt, one request a second per site),
# keeps up to ten lawyers per firm that have a photo passing the image checks, and attaches the result as a download: lawyers.jsonl (for review) and lawyers.sql
# (loads into the lawyers table). With load = yes (and the CLOUDFLARE_API_TOKEN secret) it also loads them into the LIVE database. Every photo then waits in the admin
# (Lawyer photos tab) for approval; nothing shows on the site before that.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Visit only the first N firms (0 = all)'
        default: '25'
      site:
        description: 'Only used if there is no CLOUDFLARE_API_TOKEN: a site to read the live firms from (the firm list is normally read from the database)'
        default: 'https://lawdb.ai'
      load:
        description: 'Type yes to load the lawyers into the LIVE database (lawdb-ai). Safe to run twice (INSERT OR IGNORE). The migration must have been applied first.'
        default: 'no'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 Pillow
      - name: Read the live firms from the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9cfcdb7afabb6ee5cf8e3419178a4650
        run: |
          set -e
          mkdir -p data/lawyers
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN: reading the firm list from ${{ inputs.site }} instead"; echo "${{ inputs.site }}" > data/lawyers/source.txt; exit 0; fi
          npm install --no-save wrangler@4
          npx wrangler d1 execute DB --remote --json --command "SELECT slug, name, json_extract(data, '\$.website') AS site, city, state FROM firms WHERE status = 'live' AND COALESCE(json_extract(data, '\$.website'), '') != '' ORDER BY slug" > data/lawyers/firms.raw.json
          python3 - <<'PY'
          import json
          raw = open('data/lawyers/firms.raw.json').read()
          rows = json.loads(raw[raw.index('['):])[0]['results']
          json.dump(rows, open('data/lawyers/firms.json', 'w'))
          open('data/lawyers/source.txt', 'w').write('data/lawyers/firms.json')
          print(len(rows), 'live firms with a website')
          PY
      - name: Crawl
        run: python3 tools/us-data/lawyers.py "$(cat data/lawyers/source.txt)" --out data/lawyers/lawyers.jsonl --sql data/lawyers/lawyers.sql --limit "${{ inputs.limit }}" --workers 6
      - name: Load into the live database
        if: ${{ inputs.load == 'yes' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9cfcdb7afabb6ee5cf8e3419178a4650
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret first."; exit 1; fi
          npm install --no-save wrangler@4
          npx wrangler d1 execute DB --remote --yes --file=data/lawyers/lawyers.sql
          npx wrangler d1 execute DB --remote --command "SELECT photo_status, COUNT(*) AS lawyers FROM lawyers GROUP BY photo_status"
      - uses: actions/upload-artifact@v4
        with:
          name: lawyers
          path: data/lawyers/
